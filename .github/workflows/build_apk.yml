name: Build Android APK (Buildozer)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            zip \
            unzip \
            ccache \
            lld

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # Pre-seed Buildozer SDK directory with accepted licenses
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          if [ -d "$ANDROID_SDK_ROOT/licenses" ]; then
            cp -r $ANDROID_SDK_ROOT/licenses/* /home/runner/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          fi

      - name: Set Environment Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "BUILDOZER_ACCEPT_SDK_LICENSE=1" >> $GITHUB_ENV

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            Cython==0.29.36 \
            buildozer \
            virtualenv

      - name: Build APK with Buildozer
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: "1"
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Find & Check APK
        if: always()
        run: |
          echo "=== Generated Files in bin/ ==="
          ls -la bin/ || true
          echo "=== Find all .apk files ==="
          find . -name "*.apk" || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-build-log
          path: buildozer.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-signal-desk-apk
          path: bin/*.apk
          if-no-files-found: warn
